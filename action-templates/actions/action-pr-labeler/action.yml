name: "PR Labeler"
description: "Action to automatically label pull requests using the configuration file in `.github/labeler.yml` of the repositories. More information about the configuration of the `labeler.yml` file can be found in [official documentation](https://github.com/actions/labeler)"

inputs:
  configuration-path:
    description: "Path to the configuration file inside the repository"
    required: false
    default: ".github/labeler.yml"
  repository:
    description: "Optional repository to checkout to reference external configuration file"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout external repository
      if: ${{ inputs.repository != '' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: "${{ inputs.repository }}"
        persist-credentials: false
    - name: Label PR
      uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
      with:
        configuration-path: ${{ inputs.configuration-path }}
