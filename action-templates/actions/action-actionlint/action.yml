name: "Lint actions"
description: "Action to lint your workflows using [actionlint](https://github.com/rhysd/actionlint)"

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run actionlint on your workflow files
      uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13
