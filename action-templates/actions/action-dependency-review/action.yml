name: "Dependency review"
description: "The dependency review action scans your pull requests for dependency changes, and will raise an error if any invalid licenses are being used. It will always use the baseline configuration in <https://github.com/it-at-m/.github/blob/main/workflow-configs/dependency_review.yaml>. If you use the action with a matrix, you should watch out that the path is different for each call."

inputs:
  allow-dependencies-licenses:
    description: "Additional comma separated string of packages to be ignored by the dependency check (see https://github.com/package-url/purl-spec for more information)"
    required: false
    default: ""
  vulnerability-check:
    description: "Enables/Disables vulnerability scanning of dependencies"
    required: false
    default: "false"
  allow-ghsas:
    description: "Additional comma separated string of GHSAs (see https://github.com/advisories) to be suppressed by the vulnerability check. For CVEs, the corresponding GHSA ID has to be used instead of directly using the CVE identifier."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Execute dependency review check
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        config-file: it-at-m/.github/workflow-configs/dependency_review.yaml@main
        allow-dependencies-licenses: ${{ inputs.allow-dependencies-licenses }}
        vulnerability-check: ${{ inputs.vulnerability-check }}
        allow-ghsas: ${{ inputs.allow-ghsas }}
