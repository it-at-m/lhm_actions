name: "Trivy Dependency Scan"
description: "Run a Trivy filesystem scan of the repository"

inputs:
  trivyignore-files:
    description: "Path(s) to .trivyignore file(s) to ignore known CVEs (comma- or newline-separated)"
    required: false
    default: ".trivyignore"
  timeout:
    description: "Timeout for Trivy scan"
    required: false
    default: 15m0s
  path:
    description: "Path to scan with Trivy. For scan-type=sbom, this must point to a specific SBOM file (e.g. sbom.cdx.json), not a directory."
    required: false
    default: "."
  scan-type:
    description: "scan type, e.g. fs or sbom"
    required: false
    default: "fs"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      if: inputs.scan-type  == 'fs'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0 # Required for vitepress lastUpdated
        persist-credentials: false
    - name: Run Trivy vulnerability scanner in repository mode
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_INCLUDE_DEV_DEPS: "true"
      with:
        scan-type: "${{ inputs.scan-type }}"
        scan-ref: "${{ inputs.path }}"
        format: "json"
        exit-code: "1"
        timeout: "${{ inputs.timeout }}"
        trivyignores: ${{ inputs.trivyignore-files }}
        output: trivy-report.json
    - name: convert
      if: ${{ always() && hashFiles('trivy-report.json') != '' }}
      shell: bash
      run: |
        trivy convert --format table --output trivy-results.txt  trivy-report.json
        cat trivy-results.txt
        trivy convert --format sarif --output trivy-results.sarif  trivy-report.json

    - name: Upload Vulnerability Scan Results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        path: trivy-report.json
        retention-days: 7
        archive: false

    - name: Upload Trivy scan results to GitHub Security tab
      if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        sarif_file: "trivy-results.sarif"
        category: ${{ inputs.path }}
