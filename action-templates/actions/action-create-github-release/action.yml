name: "Create GitHub release"
description: "Creates a GitHub release from a downloaded artifact"
inputs:
  artifact-name:
    description: "Name of the artifact to download"
    required: true
  tag-name:
    description: "Name of a tag (e.g. sps-1.0.0 or myproject-1.0.0)"
    required: true
  artifact-path:
    description: "Path to the artifacts (e.g. ./target/*.jar)"
  draft:
    description: "Whether it is a draft release or not"
    default: "false"
  prerelease:
    description: "Whether it is a prerelease or not"
    default: "false"
  generate-release-notes:
    description: "Generate release notes"
    default: "false"
  skip-artifact-decompress:
    description: "Whether to skip decompressing a ZIP file (if detected). If true, the downloaded artifact will not be automatically extracted/decompressed. This is useful when you want to handle the artifact as-is without extraction."
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Download a single artifact
      id: download-artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{inputs.artifact-name}}
        skip-decompress: ${{inputs.skip-artifact-decompress}}
    - name: Create GitHub release
      id: create_release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG_NAME: ${{ inputs.tag-name }}
        IS_DRAFT: ${{ inputs.draft }}
        IS_PRERELEASE: ${{ inputs.prerelease }}
        GEN_NOTES: ${{ inputs.generate-release-notes }}
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
      shell: bash
      run: |
        ARGS=()
        if [ "$IS_DRAFT" == "true" ]; then ARGS+=(--draft); fi
        if [ "$IS_PRERELEASE" == "true" ]; then ARGS+=(--prerelease); fi
        if [ "$GEN_NOTES" == "true" ]; then ARGS+=(--generate-notes); fi

        gh release create "$TAG_NAME" $ARTIFACT_PATH \
          --target "${{ github.sha }}" \
          "${ARGS[@]}"
