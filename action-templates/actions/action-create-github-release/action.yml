name: "Create GitHub release"
description: "Creates a GitHub release from a downloaded artifact"
inputs:
  artifact-name:
    description: "Name of the artifact to download"
    required: true
  tag-name:
    description: "Name of a tag (e.g. sps-1.0.0 or myproject-1.0.0)"
    required: true
  artifact-path:
    description: "Path to the artifacts (e.g. ./target/*.jar)"
  draft:
    description: "Whether it is a draft release or not"
    default: "false"
  prerelease:
    description: "Whether it is a prerelease or not"
    default: "false"
  generate-release-notes:
    description: "Generate release notes"
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Download a single artifact
      id: download-artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{inputs.artifact-name}}
        skip-decompress: true
    - name: check-filepath
      id: check-filepath
      shell: bash
      run: |
         echo ${{ steps.download-artifact.outputs.download-path }}
         ls ${{ steps.download-artifact.outputs.download-path }}
#        path=${{inputs.artifact-path}}
#        if [ -z "$path" ]; then
#           echo "empty variable" 
#        elif [ -f "$path" ]; then
#            echo "It's a regular file."
#            echo "filename=$path" >> $GITHUB_OUTPUT
#        elif [ -d "$path" ]; then
#            echo "It's a folder (directory)."
#            zip -r output.zip $path
#            echo "filename=output.zip" >> $GITHUB_OUTPUT
#        elif [ -e "$path" ]; then
#            echo "The path exists, but it is something else (like a symlink or device)."
#        else
#            echo "The path does not exist."
#        fi
    - name: Create GitHub release
      id: create_release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{inputs.tag-name}}
        draft: ${{inputs.draft == 'true'}}
        prerelease: ${{inputs.prerelease == 'true'}}
        generate_release_notes: ${{inputs.generate-release-notes == 'true'}}
        files: |
         ${{ steps.check-filepath.outputs.filename }}
