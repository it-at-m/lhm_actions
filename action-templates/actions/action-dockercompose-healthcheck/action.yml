name: "Validate docker stack"
description: "Validates a Docker compose stack using its defined health checks"

inputs:
  max-retries:
    description: "Maximum number of retry attempts"
    required: false
    default: "10"
  retry-interval:
    description: "Interval between retries in seconds"
    required: false
    default: "10"
  compose-file-path:
    description: "Path to the Docker compose file"
    required: false
    default: "./"
  compose-file-name:
    description: "Name of the Docker compose file"
    required: false
    default: "docker-compose.yml"
  skip-exited:
    description: "Skip checking exited containers  (useful for init containers)"
    required: false
    default: "false"
  skip-no-healthcheck:
    description: "Skip checking containers without health checks. Note: This applies to both persistent and existing containers."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Start the Docker Compose stack
      working-directory: ${{ inputs.compose-file-path }}
      shell: bash
      env:
        COMPOSE_FILE_NAME: ${{ inputs.compose-file-name }}
      run: docker compose -f "$COMPOSE_FILE_NAME" up -d
    - name: Run health check against the started services
      working-directory: ${{ inputs.compose-file-path }}
      shell: bash
      env:
        MAX_RETRIES: ${{ inputs.max-retries }}
        RETRY_INTERVAL: ${{ inputs.retry-interval }}
        COMPOSE_FILE_NAME: ${{ inputs.compose-file-name }}
        SKIP_EXITED: ${{ inputs.skip-exited }}
        SKIP_NO_HEALTHCHECK: ${{ inputs.skip-no-healthcheck }}
      run: ${{ github.action_path }}/run.sh
