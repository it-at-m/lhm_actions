name: Test action-npm-build

on:
  push:
    paths:
      - .github/workflows/test-action-npm-build.yml
      - action-templates/actions/action-npm-build/action.yml
  pull_request:
    types:
      - opened
      - reopened
  pull_request_review:
    types:
      - submitted

env:
  node-version: "22"
  app-path: "docs"
  run-lint: "true"
  run-test: "false"

permissions:
  contents: read # for checkout

jobs:
  test-npm-build:
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event.review.state == 'approved')
    name: test-npm-build
    runs-on: ubuntu-latest
    steps:
      - name: checkout-local-actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: npm-build
        uses: ./action-templates/actions/action-npm-build
        with:
          node-version: ${{ env.node-version }}
          app-path: ${{ env.app-path }}
          run-lint: ${{ env.run-lint }}
          run-test: ${{ env.run-test }}
