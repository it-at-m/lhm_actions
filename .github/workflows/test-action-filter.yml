# Workflow to Test action action-filter
name: Test action action-filter

on:
  push:
     paths:
       - .github/workflows/test-action-filter.yml
       - action-templates/actions/action-filter/action.yml
  pull_request:

permissions:
  contents: read # for checkout
  pull-requests: read # for dorny/paths-filter
jobs:
  test-action-filter:
    name: test-action-filter
    runs-on: ubuntu-latest
    steps:
      - name: checkout-local-actions
        if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: checkout-local-actions
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: test-action-filter
        uses: ./action-templates/actions/action-filter
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            java:
              - '**/*.java'
            markdown:
              - '**/*.md'
            actions:
              - '.github/**/*.yml'
              - '.github/**/*.yaml'
              - 'action-templates/**/*.yml'
              - 'action-templates/**/*.yaml'
      - name: get-base-ref-commit-id
        id: base-branch
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        run: |
          echo "base-branch=origin/$GITHUB_BASE_REF"
          echo "base-branch=origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
      - name: check-filter-output
        env:
          CATEGORIES: ${{ steps.filter.outputs.changes }}
          BASE_BRANCH: ${{ steps.base-branch.outputs.base-branch }}
        run: |
          echo "action-filter output: $CATEGORIES"
          
          # remove "[" and "]"
          CATEGORIES=${CATEGORIES#[}
          CATEGORIES=${CATEGORIES%]}
          
          # remove quota
          CATEGORIES=${CATEGORIES//\"/}
          
          # convert CATEGORIES into an Array (based on comma) named category_list
          IFS=',' read -ra category_list <<< "$CATEGORIES"
          
          num_categories=${#category_list[@]}
          echo "num_categories: $num_categories"
          
          # Activate globstar for pattern match
          shopt -s globstar
          
          # check each category only once
          action_found=0
          java_found=0
          javascript_found=0
  
          # get all changed files (diff_ouptut.txt contains only filenames)
          if git rev-parse --verify HEAD~1 > /dev/null 2>&1; then
            if [ -z "$BASE_BRANCH" ]; then
              # BASE_BRANCH is empty on push. We check Head
              BASE_BRANCH=HEAD
            fi
          
            echo "git diff-tree $BASE_BRANCH"
            git diff-tree --no-commit-id --name-only -r "$BASE_BRANCH" > diff_output.txt
          else
            # no previous commit, e.g. initial commit
            echo "git diff-tree --root"
            git diff-tree --no-commit-id --name-only -r --root > diff_output.txt
          fi
  
          echo "Changed files:"
          cat diff_output.txt
          
          # Loop through all files
          while IFS= read -r filename; do
            echo "Changed file: $filename"
          
            # Check, whether filename follows a category
            for category in "${category_list[@]}"; do
              case "$category" in
                "actions")
                  if [[ $action_found == 0 ]] &&
                     { [[ "$filename" == .github/**/*.yml ]] || \
                     [[ "$filename" == .github/**/*.yaml ]] || \
                     [[ "$filename" == action-templates/**/*.yml ]] || \
                     [[ "$filename" == action-templates/**/*.yaml ]] ; } then
                       echo "Category $category found."
                       num_categories=$((--num_categories))
                       action_found=1
                       break
                  fi
                  ;;
                "java")
                  if [[ $java_found == 0 ]] && [[ "$filename" == **/*.java ]]; then
                    echo "Category $category found"
                    num_categories=$((--num_categories))
                    java_found=1
                    break
                  fi
                  ;;
                "markdown")
                  if  [[ $javascript_found == 0 ]] && [[ "$filename" == **/*.md ]]; then
                    echo "Category $category found"
                    num_categories=$((--num_categories))
                    javascript_found=1
                    break
                  fi
                  ;;
                *)
                  # File has not category
                  echo "$filename follows no category"
                  ;;
              esac
            done
          done < diff_output.txt
          
          # Check if all categories (but only expected ones) were found 
          if [[ "$num_categories" -ne "0" ]]; then
            echo "Expected num_categories == 0 but was $num_categories"
            exit 1
          fi
          
          echo "Test of action-filter ok"
