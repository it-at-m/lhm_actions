name: Deploy documentation website

on:
  # Runs on pushes to any branch when changes are made to docs or workflow
  push:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - run: |
          pip install -r requirements.txt
          python generate_docs.py > ./docs/actions_copy.md
          mv ./docs/actions_copy.md ./docs/actions.md

      - name: Commit and push linting fixes
        # Run only on:
        # - Pull requests
        # - Not on the default branch
        if: github.ref_name != github.event.repository.default_branch
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.ref }}
          commit_message: "[skip ci] automatically update action.yml"
          commit_user_name: super-linter
          commit_user_email: super-linter@super-linter.dev
      - id: build_docs
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-docs@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
      - id: deploy_docs
        # Only deploy documentation from the main branch to prevent unauthorized changes
        uses: it-at-m/lhm_actions/action-templates/actions/action-deploy-docs@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
