name: Deploy documentation website

on:
  push:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: "pip" # caching pip dependencies
      - run: |
          pip install -r requirements.txt
          python generate_docs.py > ./docs/actions_copy.md
          mv ./docs/actions_copy.md ./docs/actions.md

      - name: Commit and push linting fixes
        # Run only on:
        # - Pull requests
        # - Not on the default branch
        if: github.ref_name != github.event.repository.default_branch
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.ref }}
          commit_message: "[skip ci] automatically update action.yml"
          commit_user_name: super-linter
          commit_user_email: super-linter@super-linter.dev
      - id: build_docs
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-docs@9bde6576151908ace5f517ca623fea3b98600cb7 # v1.6.5
      - id: deploy_docs
        # Only deploy documentation from the main branch to prevent unauthorized changes
        uses: it-at-m/lhm_actions/action-templates/actions/action-deploy-docs@9bde6576151908ace5f517ca623fea3b98600cb7 # v1.6.5
