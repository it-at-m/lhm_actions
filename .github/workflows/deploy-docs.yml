name: Deploy documentation website

on:
  # Runs on pushes to any branch when changes are made to docs or workflow
  push:
    branches:
      - main
  pull_request:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - run: |
          pip install -r requirements.txt
          python generate-docs.py > ./docs/actions_copy.md
          mv ./docs/actions_copy.md ./docs/actions.md
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          node-version-file: docs/package.json
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: |
          npx markdownlint-cli -f ./docs/actions.md
      - name: changes commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

          git add docs/actions.md

          git diff --quiet && git diff --staged --quiet || (git commit -m "automatically update action.yml" && git push)
      - id: build_docs
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-docs@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
      - id: deploy_docs
        # Only deploy documentation from the main branch to prevent unauthorized changes
        uses: it-at-m/lhm_actions/action-templates/actions/action-deploy-docs@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
