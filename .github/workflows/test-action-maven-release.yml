name: Test action-maven-release

on:
  push:
    paths:
      - .github/workflows/test-action-maven-release.yml
      - action-templates/actions/action-maven-release/action.yml
  pull_request:
    types:
      - opened
      - reopened
  pull_request_review:
    types:
      - submitted

env:
  app-path: "__tests__/maven-helloworld"
  use-pr: true
  release-method: "patch"

permissions:
  contents: read # for checkout

jobs:
  test-maven-release:
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event.review.state == 'approved')
    name: test-maven-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      pull-requests: write # to be able to comment on released pull requests
    steps:
      - name: checkout-local-actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: maven-release
        uses: ./action-templates/actions/action-maven-release
        with:
          app-path: ${{ env.app-path }}
          release-method: ${{ env.release-method}}
          use-pr: ${{ env.use-pr }}
