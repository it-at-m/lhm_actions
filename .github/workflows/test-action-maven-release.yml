name: Test action-maven-release

on:
  push:
    tags-ignore:
      - "**"
    paths:
      - .github/workflows/test-action-maven-release.yml
      - action-templates/actions/action-maven-release/action.yml
      - __tests__/maven-helloworld/**

env:
  app-path: "__tests__/maven-helloworld"
  use-pr: true
  release-method: "patch"
  java-version: 25

permissions:
  contents: read # for checkout

jobs:
  test-maven-release:
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event.review.state == 'approved')
    name: test-maven-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      pull-requests: write # to be able to comment on released pull requests
    steps:
      - name: checkout-local-actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: maven-release
        uses: ./action-templates/actions/action-maven-release
        with:
          app-path: ${{ env.app-path }}
          release-method: ${{ env.release-method}}
          use-pr: ${{ env.use-pr }}
          java-version: ${{env.java-version }}
