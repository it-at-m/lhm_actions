name: Test action action-dockercompose-healthcheck
on:
  push:
    paths:
      - .github/workflows/test-action-dockercompose-healthcheck.yml
      - action-templates/actions/action-dockercompose-healthcheck/action.yml
  pull_request:
    types:
      - opened
      - reopened
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read # for checkout

jobs:
  test-dockercompose-healthcheck:
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event.review.state == 'approved')
    name: test-dockercompose-healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: checkout-local-actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: dockercompose-healthcheck
        uses: ./action-templates/actions/action-dockercompose-healthcheck
        with:
          compose-file-path: "__tests__"
