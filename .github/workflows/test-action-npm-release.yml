name: Test action-npm-release

on:
  push:
    tags-ignore:
      - "**"
    paths:
      - .github/workflows/test-action-npm-release.yml
      - action-templates/actions/action-npm-release/action.yml

env:
  app-path: "docs"
  use-pr: true
  release-version: "patch"

permissions:
  contents: read # for checkout

jobs:
  test-npm-release:
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event.review.state == 'approved')
    name: test-npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: checkout-local-actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: npm-release
        uses: ./action-templates/actions/action-npm-release
        with:
          app-path: ${{ env.app-path }}
          releaseVersion: ${{ env.release-version }}
          use-pr: ${{ env.use-pr }}
